<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y.R. Yaswini | Portfolio</title>
    <!-- Google Fonts for Minimalist Typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fafafa;
            --text-main: #111111;
            --text-muted: #666666;
            --accent: #2e7d32; /* Eco-green accent inspired by GreenSteps */
            --border: #e5e5e5;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(250, 250, 250, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2rem;
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        /* Sections Universal Layout */
        section {
            padding: 6rem 2rem 4rem 2rem;
            max-width: 900px;
            margin: 0 auto;
            border-bottom: 1px solid var(--border);
        }

        section:last-of-type {
            border-bottom: none;
        }

        .section-num {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            display: block;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
        }

        /* Hero / Home Section */
        #home {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 90vh;
            padding-top: 8rem;
        }

        .badge-grid {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .badge {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            line-height: 1.2;
            margin-bottom: 1.5rem;
        }

        .hero-desc {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 650px;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .hero-cta {
            font-size: 0.95rem;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* About Section */
        .about-quote {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.5rem;
            color: var(--accent);
            margin-top: 2rem;
            border-left: 3px solid var(--accent);
            padding-left: 1.5rem;
        }

        /* Education Timeline */
        .timeline-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }

        .time-period {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.25rem;
        }

        .institution {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        /* Skills Radar Grid */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .skill-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 12px;
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .skill-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .skill-level {
            font-size: 0.8rem;
            background: #e8f5e9;
            color: var(--accent);
            padding: 0.2rem 0.6rem;
            border-radius: 10px;
            font-weight: 600;
        }

        .skill-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Projects Layout */
        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2.5rem;
            border-radius: 16px;
            margin-bottom: 2rem;
        }

        .project-tag {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
        }

        .project-title {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .project-body {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .project-meta {
            font-size: 0.85rem;
            font-style: italic;
            color: var(--text-muted);
            display: inline-block;
            border-top: 1px solid var(--border);
            padding-top: 0.75rem;
            width: 100%;
        }

        /* Milestones Matrix */
        .milestone-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .milestone-card {
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 12px;
            background: var(--card-bg);
        }

        .milestone-icon {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }

        .milestone-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        /* Contact Area */
        .contact-box {
            text-align: center;
            background: var(--text-main);
            color: #ffffff;
            padding: 4rem 2rem;
            border-radius: 20px;
            margin-top: 2rem;
        }

        .contact-box h3 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .contact-box p {
            color: #cccccc;
            margin-bottom: 2rem;
        }

        .email-link {
            display: inline-block;
            color: #ffffff;
            font-size: 1.2rem;
            text-decoration: none;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 0.25rem;
            font-weight: 500;
            transition: opacity 0.2s ease;
        }

        .email-link:hover {
            opacity: 0.8;
        }

        footer {
            text-align: center;
            padding: 4rem 2rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Responsive Tweaks */
        @media (max-width: 768px) {
            .nav-links { display: none; } /* Kept clean for simple code */
            .hero-title { font-size: 2.5rem; }
            h2 { font-size: 2rem; }
            section { padding: 4rem 1.5rem 3rem 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <nav>
        <div class="nav-container">
            <a href="#home" class="logo">YR</a>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#education">Education</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#milestones">Milestones</a></li>
